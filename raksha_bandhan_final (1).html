<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .joke-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            line-height: 1.6;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            word-wrap: break-word;
        }

        .joke-box.loading {
            background: linear-gradient(90deg, #667eea, #764ba2, #667eea);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        .joke-text {
            opacity: 0;
            animation: fadeIn 0.5s ease-in forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .loading-text {
            display: none;
            color: #667eea;
            font-size: 0.9em;
            margin-top: 15px;
            font-style: italic;
        }

        .loading-text.show {
            display: block;
        }

        .joke-type {
            color: #999;
            font-size: 0.9em;
            margin-top: 15px;
            font-style: italic;
        }

        .error {
            color: #e74c3c;
            background: #fadbd8;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .error.show {
            display: block;
        }

        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 0.9em;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        <p class="subtitle">Get a random laugh instantly!</p>
        
        <div class="joke-box" id="jokeBox">
            Click the button to get a joke!
        </div>
        
        <div class="joke-type" id="jokeType"></div>
        
        <div class="error" id="errorMsg"></div>
        
        <button id="getJokeBtn" onclick="getJoke()">Get a Joke</button>
        
        <div class="loading-text" id="loadingText">Fetching your joke...</div>
        
        <div class="footer">
            <p>Powered by <a href="https://official-joke-api.appspot.com/" target="_blank">Official Joke API</a></p>
        </div>
    </div>

    <script>
        const jokeBox = document.getElementById('jokeBox');
        const jokeType = document.getElementById('jokeType');
        const errorMsg = document.getElementById('errorMsg');
        const loadingText = document.getElementById('loadingText');
        const getJokeBtn = document.getElementById('getJokeBtn');

        async function getJoke() {
            try {
                // Disable button and show loading state
                getJokeBtn.disabled = true;
                loadingText.classList.add('show');
                jokeBox.classList.add('loading');
                errorMsg.classList.remove('show');

                // Fetch a random joke from the API
                const response = await fetch('https://official-joke-api.appspot.com/random_joke');

                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const joke = await response.json();

                // Display the joke with animation
                jokeBox.classList.remove('loading');
                
                // Display setup and punchline
                let jokeContent = '';
                if (joke.setup && joke.punchline) {
                    jokeContent = `<div class="joke-text">${joke.setup}<br><br><strong>${joke.punchline}</strong></div>`;
                } else {
                    jokeContent = `<div class="joke-text">${joke.joke || 'Could not load joke'}</div>`;
                }
                
                jokeBox.innerHTML = jokeContent;
                jokeType.textContent = `Type: ${joke.type || 'general'}`;

            } catch (error) {
                console.error('Error:', error);
                jokeBox.classList.remove('loading');
                jokeBox.textContent = 'Oops! Could not load a joke. Please try again!';
                jokeType.textContent = '';
                errorMsg.textContent = `Error: ${error.message}`;
                errorMsg.classList.add('show');
            } finally {
                // Re-enable button and hide loading text
                getJokeBtn.disabled = false;
                loadingText.classList.remove('show');
            }
        }

        // Load a joke when the page loads
        window.addEventListener('load', () => {
            getJoke();
        });
    </script>
</body>
</html>
